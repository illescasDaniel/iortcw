name: overlay-codmod-files
on:
  push:
    branches: [cursor/codmod-patches-0f47]
    paths:
      - "codmod-patches/OVERLAY"
  workflow_dispatch:

concurrency:
  group: overlay-codmod-files
  cancel-in-progress: false

jobs:
  overlay:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/codmod-patches-0f47
          fetch-depth: 0
      - name: Fetch and apply overlay tarball
        run: |
          set -euo pipefail
          URL="https://litter.catbox.moe/l11bb5.gz"
          EXPECT_SHA="461cf72a71da66787c754c69707da745aa7db686685477d64886df4f2f5a4f1f"
          curl -fsSL -o /tmp/overlay.tar.gz "$URL"
          echo "$EXPECT_SHA  /tmp/overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/overlay.tar.gz
          # overlay/ contains paths relative to repo root
          cp -a overlay/. .
          rm -rf overlay codmod-patches
          git config user.name "codmod-patcher"
          git config user.email "codmod-patcher@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "codmod: overlay remaining gap files from local tree"
          git push origin HEAD:cursor/codmod-patches-0f47
